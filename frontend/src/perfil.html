<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Xgommi</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body class="bg-neutral-900 text-base xl:text-lg 2xl:text-xl">
    <div class="flex flex-col md:flex-row h-full">
        <!-- Sidebar -->
        <aside class="ml-32 items-center mt-20 p-4">
            <img src="avatar.ico" alt="Favicon Image" class="w-64 h-64 rounded-full bg-orange-600">
            <button type="button" class="flex mt-3 justify-center w-full text-zinc-100 font-serif p-2 bg-zinc-800 rounded-md mb-2" data-bs-toggle="modal" data-bs-target="#followersModal">Seguidores</button>
            <button type="button" class="flex justify-center w-full text-zinc-100 font-serif p-2 bg-zinc-800 rounded-md mb-2" data-bs-toggle="modal" data-bs-target="#followingModal">Seguindo</button>
            <button type="button" class="absolute top-4 right-4 text-zinc-100 font-serif p-2 bg-zinc-800 rounded-md" onclick="window.location.href='index.html'">Voltar</button>
        </aside>
        
        <section class="relative ml-6 mt-16 p-20 bg-zinc-300 rounded-md">
            <h2 class="text-2xl font-bold mb-9 text-stone-950 text-center mt-8">Informações de Perfil</h2>
            <div class="pl-4">
                <p class="text-lg mb-3 text-stone-950"><strong>Nome:</strong> Ely</p>
                <p class="text-lg mb-3 text-stone-950"><strong>Usuário:</strong> @elizão</p>
                <p class="text-lg mb-3 text-stone-950"><strong>Email:</strong> elylylyly@example.com</p>
                <p class="text-lg mb-3 text-stone-950"><strong>Número de posts:</strong> 32</p>
            </div>
        </section>
    </div>

        <!-- Modal para Seguidores -->
    <div class="modal fade" id="followersModal" tabindex="-1" aria-labelledby="followersModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="followersModalLabel">Seguidores</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul class="list-group">
                        <li class="list-group-item">Seguidor 1</li>
                        <li class="list-group-item">Seguidor 2</li>
                        <li class="list-group-item">Seguidor 3</li>
                        <!-- Adicione mais seguidores aqui -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Seguindo -->
    <div class="modal fade" id="followingModal" tabindex="-1" aria-labelledby="followingModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="followingModalLabel">Seguindo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul class="list-group">
                        <li class="list-group-item">Seguindo 1</li>
                        <li class="list-group-item">Seguindo 2</li>
                        <li class="list-group-item">Seguindo 3</li>
                        <!-- Adicione mais seguindo aqui -->
                    </ul>
                </div>
            </div>
        </div>
    </div>


        

    <!-- Scripts -->
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
